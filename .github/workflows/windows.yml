name: Windows executable
on: [push, pull_request, workflow_dispatch, workflow_call]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and build tools
        run: |
          python -m pip install -r requirements-app.txt pyinstaller==6.13.0
          python -m pip check
      - name: Build native Windows installer
        run: python scripts/build-windows.py
      - name: Install, launch and uninstall the actual EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'DeeL 試験 with spaces'
          $previous = Join-Path $env:RUNNER_TEMP 'previous-setup.exe'
          Invoke-WebRequest 'https://github.com/icchan090pp/personal-ai-studio/releases/download/v0.1.2/DeeL-Pyess-Setup-v0.1.2-Windows-x64.exe' -OutFile $previous
          if ((Get-FileHash $previous -Algorithm SHA256).Hash.ToLower() -ne '6aab91f7d7f92b7d5df4f799944a1811b96633a9bdf35f16f4ce310c807e8fbe') { throw 'Previous release checksum mismatch' }
          $oldSetup = Start-Process -FilePath $previous -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"") -PassThru -Wait
          if ($oldSetup.ExitCode -ne 0) { throw 'Previous version install failed' }
          $oldApp = Start-Process -FilePath "$destination/DeeL Pyess.exe" -ArgumentList '--smoke-test' -PassThru
          if (-not $oldApp.WaitForExit(120000) -or $oldApp.ExitCode -ne 0) { throw 'Previous version seed failed' }
          $database = "$env:LOCALAPPDATA/DeeL Pyess/data/studio.sqlite3"
          $before = (Get-FileHash $database -Algorithm SHA256).Hash
          $installer = Resolve-Path 'artifacts/release/DeeL-Pyess-Setup-v0.1.3-Windows-x64.exe'
          $setup = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"") -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          if ((Get-FileHash $database -Algorithm SHA256).Hash -ne $before) { throw 'Upgrade modified user database' }
          if (-not (Test-Path "$env:APPDATA/Microsoft/Windows/Start Menu/Programs/DeeL Pyess/DeeL Pyess.lnk")) { throw 'Start menu shortcut missing' }
          & "$destination/runtime/python.exe" -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Bundled dependencies invalid' }
          # Actually install both CPU packages and the isolated DirectML backend.
          Push-Location $destination
          & "$destination/runtime/python.exe" -m studio.setup_runtime --backend directml
          if ($LASTEXITCODE -ne 0) { throw 'CPU/DirectML setup failed' }
          & "$env:LOCALAPPDATA/DeeL Pyess/directml/Scripts/python.exe" -c "import torch, torch_directml; assert torch.__version__.startswith('2.4.1'); print('DirectML import verified')"
          if ($LASTEXITCODE -ne 0) { throw 'Isolated DirectML runtime failed' }
          & "$destination/runtime/python.exe" -c "import torch; assert torch.__version__.startswith('2.7.0+cpu'); print('CPU runtime preserved')"
          if ($LASTEXITCODE -ne 0) { throw 'DirectML altered primary Torch runtime' }
          Pop-Location
          # Prove launching does not depend on a preinstalled Python in PATH.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:PYTHONHOME = 'C:\Nonexistent external Python'
          $env:PYTHONPATH = 'C:\Nonexistent external packages'
          foreach ($attempt in 1..5) {
            Remove-Item "$env:LOCALAPPDATA/DeeL Pyess/windows-smoke.json" -ErrorAction SilentlyContinue
            $arguments = if ($attempt -eq 1) { @('--smoke-test', '--smoke-setup') } else { @('--smoke-test') }
            $app = Start-Process -FilePath "$destination/DeeL Pyess.exe" -ArgumentList $arguments -PassThru
            if (-not $app.WaitForExit(240000)) { Stop-Process -Id $app.Id -Force; throw 'App startup timed out' }
            if ($app.ExitCode -ne 0) { throw "App failed: $($app.ExitCode)" }
            $result = Get-Content "$env:LOCALAPPDATA/DeeL Pyess/windows-smoke.json" | ConvertFrom-Json
            if (-not $result.passed) { throw 'Actual API smoke failed' }
            Copy-Item "$env:LOCALAPPDATA/DeeL Pyess/windows-smoke.json" "artifacts/release/windows-smoke-$attempt.json"
          }
          if (Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*$destination*launch.py*" -or $_.CommandLine -like "*$destination*studio.app:app*" }) { throw 'Server process leaked after exit' }
          $uninstall = Start-Process -FilePath "$destination/unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -PassThru -Wait
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$destination/DeeL Pyess.exe")) { throw 'Uninstall failed' }
          if (-not (Test-Path "$env:LOCALAPPDATA/DeeL Pyess/data")) { throw 'Uninstall deleted user data' }
      - name: Collect Windows diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          foreach ($name in @('startup.log', 'windows-desktop.png')) {
            $source = Join-Path "$env:LOCALAPPDATA/DeeL Pyess" $name
            if (Test-Path $source) { Copy-Item $source artifacts/release/ }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: artifacts/release/
