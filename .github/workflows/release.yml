name: Publish DeeL Pyess Preview
on:
  push:
    branches: [feat/personal-ai-studio]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify_release:
    uses: ./.github/workflows/verify.yml
  verify_windows:
    uses: ./.github/workflows/windows.yml
  release:
    needs: [verify_release, verify_windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all five recorded product runs
        run: |
          for report in docs/verification/run-{1..5}.xml; do
            python scripts/check-results.py "$report"
          done
      - name: Build source installer
        run: python scripts/package-release.py
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows
      - name: Include Windows installer and checksum
        run: |
          find artifacts/windows -name 'DeeL-Pyess-Setup-*.exe' -exec cp {} artifacts/release/ \;
          cd artifacts/release
          sha256sum DeeL-Pyess-Setup-*.exe >> SHA256SUMS.txt
      - name: Publish preview and attach installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.1.5 >/dev/null 2>&1; then
            echo 'v0.1.5 already exists; published installers must not be overwritten.'
            exit 1
          fi
          gh release create v0.1.5 artifacts/release/DeeL-Pyess-v0.1.5.zip artifacts/release/DeeL-Pyess-Setup-v0.1.5-Windows-x64.exe artifacts/release/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'DeeL Pyess v0.1.5 — Clear Tiny-SD selection and quick image creation' --prerelease --notes-file docs/release-notes.md
