name: Publish DeeL Pyess Preview
on:
  push:
    branches: [feat/personal-ai-studio]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  VERIFIED_WINDOWS_RUN: "38205292513"
  VERIFIED_TEST_RUN: "38205292556"
  VERIFIED_SOURCE: "22ffd5bdea0e53827b48ec3e524ff61232039ba9"
jobs:
  verify_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm five passing runs on identical application source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_TEST_RUN" > "$RUNNER_TEMP/test-run.json"
          python - <<'PYCODE'
          import json, os, pathlib, subprocess
          run = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'test-run.json').read_text())
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Product verification must pass before publication'
          assert run['head_sha'] == os.environ['VERIFIED_SOURCE'], 'Unexpected tested source'
          assert run['path'] == '.github/workflows/verify.yml' and run['event'] == 'push'
          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z', os.environ['VERIFIED_SOURCE'], 'HEAD']).decode().split('\0')
          forbidden = [p for p in changed if p and not p.startswith(('docs/', 'website/')) and p != '.github/workflows/release.yml']
          assert not forbidden, 'Application source changed after verification: ' + repr(forbidden)
          PYCODE
      - uses: actions/download-artifact@v4
        with:
          name: verification
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.VERIFIED_TEST_RUN }}
          path: artifacts/verified
      - name: Validate five CI reports with exactly 100 passed each
        run: |
          for report in artifacts/verified/verification/run-{1..5}/results.xml; do
            python scripts/check-results.py "$report"
          done
  verify_windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm successful Windows test and identical application source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_WINDOWS_RUN" > "$RUNNER_TEMP/windows-run.json"
          python - <<'PYCODE'
          import json, os, pathlib, subprocess
          run = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'windows-run.json').read_text())
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Windows verification must pass before publication'
          assert run['head_sha'] == os.environ['VERIFIED_SOURCE'], 'Unexpected tested source'
          assert run['path'] == '.github/workflows/windows.yml' and run['event'] == 'push'
          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z', os.environ['VERIFIED_SOURCE'], 'HEAD']).decode().split('\0')
          forbidden = [p for p in changed if p and not p.startswith(('docs/', 'website/')) and p != '.github/workflows/release.yml']
          assert not forbidden, 'Application source changed after Windows verification: ' + repr(forbidden)
          print('Windows verification passed; installed application source matches the release.')
          PYCODE
  release:
    needs: [verify_release, verify_windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all five recorded product runs
        run: |
          for report in docs/verification/run-{1..5}.xml; do
            python scripts/check-results.py "$report"
          done
      - name: Build source installer
        run: python scripts/package-release.py
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.VERIFIED_WINDOWS_RUN }}
          path: artifacts/windows
      - name: Include Windows installer and checksum
        run: |
          find artifacts/windows -name 'DeeL-Pyess-Setup-*.exe' -exec cp {} artifacts/release/ \;
          cd artifacts/release
          sha256sum DeeL-Pyess-Setup-*.exe >> SHA256SUMS.txt
      - name: Publish preview and attach installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.1.7 >/dev/null 2>&1; then
            echo 'v0.1.7 already exists; published installers must not be overwritten.'
            exit 1
          fi
          gh release create v0.1.7 artifacts/release/DeeL-Pyess-v0.1.7.zip artifacts/release/DeeL-Pyess-Setup-v0.1.7-Windows-x64.exe artifacts/release/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'DeeL Pyess v0.1.7 — Related learning, reference images and local restoration' --prerelease --notes-file docs/release-notes.md
